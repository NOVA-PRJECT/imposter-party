<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24060C"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#570F1E" stroke-width="2"/>

  <!-- Stylized Spy Fedora Hat -->
  <path d="M25,50 C25,32 35,32 50,32 C65,32 75,32 75,50 Z" fill="#FF1E43" filter="url(#glow)"/>
  <ellipse cx="50" cy="50" rx="35" ry="4" fill="#FF1E43" filter="url(#glow)"/>

  <!-- Sunglasses -->
  <path d="M32,58 C32,65 44,65 47,58 C47,56 32,56 32,58 Z M53,58 C53,65 65,65 68,58 C68,56 53,56 53,58 Z" fill="#FFF0F2" filter="url(#glow)"/>
  <rect x="47" y="57" width="6" height="2" fill="#FFF0F2" filter="url(#glow)"/>

  <!-- Glowing Exclamation Mark -->
  <path d="M50,13 L50,23" stroke="#FF1E43" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="27" r="2.5" fill="#FF1E43" filter="url(#glow)"/>
</svg>
